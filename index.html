<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="node_modules/normalize.css/normalize.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="index.js" defer></script>
  </head>

  <body>
    <aside>
      <img src="#" alt="Todo Logo" class="aside__logo" />
      <button type="button" class="aside__btn">ICON 01</button>
      <button type="button" class="aside__btn">ICON 02</button>
      <button type="button" class="aside__btn">ICON 03</button>
      <button type="button" class="aside__btn">ICON 04</button>
    </aside>
    <main>
      <div class="main__header">
        <div class="main__header__command-palette">
          <img
            class="main__header__command-palette__logo"
            src="#"
            alt="Todo Logo"
          />
          <input
            class="main__header__command-palette__input"
            type="text"
            name="cmd-palette"
            id="cmd-palette"
            placeholder="Type a command..."
          />
        </div>
      </div>
      <div class="main__title">INBOX</div>
      <div class="main__main-content">
        <!-- I'll use JavaScript to dynamically place DOM elements here -->
      </div>
    </main>
  </body>
</html>
